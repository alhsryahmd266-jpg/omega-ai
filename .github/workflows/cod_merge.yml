name: COD Merge Dataset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: yolo-data
          path: mob
      - name: Build merged dataset
        run: |
          pip install -q pyyaml
          mkdir -p cod && curl -sSL -o cod.zip "https://app.roboflow.com/ds/IBlLSkxdiH?key=eNTzulMPEw" && unzip -q -o cod.zip -d cod
          mkdir -p mob_ds && unzip -q -o mob/dataset.zip -d mob_ds
          python3 GameBot/training/kaggle_yolo26/merge_cod.py | tee merge.log
          cd merged && zip -q -r ../merged_cod.zip . && cd .. && ls -la merged_cod.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cod-merged-v1
          name: COD merged dataset (Warzone + mobile)
          files: merged_cod.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
