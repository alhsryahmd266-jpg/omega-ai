name: TFLite NHWC Convert
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  conv:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install converter
        run: |
          pip install -q "numpy<2" onnx==1.16.2 onnxruntime onnxsim onnx_graphsurgeon sng4onnx psutil
          pip install -q tensorflow==2.17.0 tf_keras==2.17.0 onnx2tf==1.26.3 ai_edge_litert
      - name: Convert (NHWC input, FP32)
        continue-on-error: true
        run: |
          mkdir -p w out
          cd w
          for m in n s; do
            curl -sSL -o yolo26${m}_960.onnx "https://github.com/${{ github.repository }}/releases/download/gamebot-final-${m}-v1/yolo26${m}_final_p2_960.onnx"
          done
          ls -la
          {
            set -x
            for m in n s; do
              onnx2tf -i yolo26${m}_960.onnx -o sm_${m} -osd 2>&1 | tail -30 || true
              ls -la sm_${m} || true
              f=$(ls sm_${m}/*float32.tflite 2>/dev/null | head -1)
              [ -n "$f" ] && cp "$f" ../out/yolo26${m}_final_p2_960_nhwc_fp32.tflite
              g=$(ls sm_${m}/*float16.tflite 2>/dev/null | head -1)
              [ -n "$g" ] && cp "$g" ../out/yolo26${m}_final_p2_960_nhwc_fp16.tflite
            done
          } > ../out/convert.log 2>&1
          cd ..
          python3 - << 'PY' >> out/convert.log 2>&1
          import glob
          from ai_edge_litert.interpreter import Interpreter
          for f in sorted(glob.glob('out/*.tflite')):
              it = Interpreter(model_path=f); it.allocate_tensors()
              print(f, 'IN', [d['shape'].tolist() for d in it.get_input_details()], 'OUT', [d['shape'].tolist() for d in it.get_output_details()])
          PY
          tail -30 out/convert.log; ls -la out
      - name: Publish logs
        if: always()
        run: |
          mkdir -p /tmp/lg && cp out/convert.log /tmp/lg/ 2>/dev/null || echo none > /tmp/lg/none.txt
          cd /tmp/lg && git init -q -b nhwc-logs && git add . && git -c user.name=gh-actions -c user.email=actions@github.com commit -q -m logs
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" nhwc-logs || true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gamebot-nhwc-v${{ github.run_number }}
          name: GameBot YOLO26 final NHWC TFLite #${{ github.run_number }}
          files: |
            out/*.tflite
            out/convert.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
