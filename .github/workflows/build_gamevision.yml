name: Build GameVision APK

on:
  push:
    branches: [main]
    paths:
      - 'GameVision/**'
      - '.github/workflows/build_gamevision.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No gradlew is committed for this module (a committed wrapper needs a binary jar, which cannot be
      # authored as plain text); install the exact same Gradle version directly instead.
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-gamevision-${{ hashFiles('GameVision/**/*.gradle*') }}
          restore-keys: gradle-gamevision-

      - name: Build APK
        working-directory: GameVision
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" \
            2>&1 | tee ../gamevision_gradle.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$GRADLE_EXIT" >> "$GITHUB_ENV"
          set -e

      - name: Save gradle log
        if: always()
        run: |
          git config --global user.email "bot@gvr.com"
          git config --global user.name "GVR Bot"
          git add gamevision_gradle.log 2>/dev/null || true
          git commit -m "build(gamevision): gradle log [skip ci]" --allow-empty 2>/dev/null || true
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep $((i*4)); done || true

      - name: Fail if gradle failed
        if: env.GRADLE_EXIT != '0'
        run: |
          echo "Gradle failed"
          grep -E "error:|FAILURE|Exception" gamevision_gradle.log | tail -40 || true
          exit 1

      - name: Locate APK
        run: |
          APK=$(find GameVision/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Record APK facts
        if: always()
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1)
          {
            echo "=== GameVision APK facts ($(date -u +%FT%TZ)) ==="
            echo "apk: $APK_PATH ($(stat -c %s "$APK_PATH" 2>/dev/null) bytes)"
            if [ -n "$AAPT2" ] && [ -f "$APK_PATH" ]; then
              "$AAPT2" dump badging "$APK_PATH" 2>/dev/null | grep -E "^package:|^sdkVersion|^targetSdkVersion|uses-permission" || true
            fi
          } >> gamevision_diag.txt
          cat gamevision_diag.txt
          git add gamevision_diag.txt || true
          git commit -m "build(gamevision): diagnostics [skip ci]" || true
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep $((i*4)); done || true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "gamevision-v${{ github.run_number }}"
          name: "GameVision v${{ github.run_number }}"
          body: |
            بوت اختبار محلي بالكامل — بدون إنترنت، بدون تعديل في اللعبة.
            حمّل الـ APK وثبّته، وافتح التطبيق لضبط الصلاحيات.
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
