name: GVR-Ultimate v4 T4x2 + Monitor

on:
  workflow_dispatch:

jobs:
  train-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 175

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: pip install kaggle==1.6.17 requests -q

      - name: Configure Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "✅ Kaggle configured: $KAGGLE_USERNAME"

      - name: Inject tokens into kernel
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p kaggle_push
          cp kaggle_kernel/kernel-metadata.json kaggle_push/
          python3 - << 'EOF'
          import os
          with open("kaggle_kernel/gvr_kaggle_train.py") as f:
              code = f.read()
          hft = os.environ.get("HF_TOKEN","")
          ghp = os.environ.get("GH_PAT","")
          code = code.replace('HFT   = os.environ.get("HF_TOKEN", "")', f'HFT   = "{hft}"')
          code = code.replace('GHPAT = os.environ.get("GH_PAT", "")',    f'GHPAT = "{ghp}"')
          with open("kaggle_push/gvr_kaggle_train.py","w") as f:
              f.write(code)
          print("✅ Tokens injected")
          EOF

      - name: Push to Kaggle T4×2 GPU
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          cd kaggle_push
          kaggle kernels push -p . 2>&1
          echo "✅ Kernel pushed to https://kaggle.com/$KAGGLE_USERNAME/gvr-gpu-training"

      - name: Monitor + Read Logs Every 5 min
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'EOF'
          import os, json, requests, base64, subprocess, time, sys

          username = os.environ.get("KAGGLE_USERNAME","")
          pat      = os.environ.get("GH_PAT","")
          kernel   = f"{username}/gvr-gpu-training"

          def save_github(filename, text):
              if not pat: return
              content = base64.b64encode(text.encode()).decode()
              url = f"https://api.github.com/repos/alhsryahmd266-jpg/omega-ai/contents/{filename}"
              check = requests.get(url, headers={"Authorization": f"token {pat}"})
              body = {"message": f"Monitor: {filename}", "content": content}
              if check.status_code == 200:
                  body["sha"] = check.json()["sha"]
              requests.put(url, headers={"Authorization": f"token {pat}"}, json=body)

          def get_status():
              r = subprocess.run(["kaggle","kernels","status",kernel],
                                  capture_output=True, text=True)
              return r.stdout.strip()

          def get_log():
              r = subprocess.run(["kaggle","kernels","output",kernel,"-p","/tmp/klog"],
                                  capture_output=True, text=True)
              import glob
              logs = glob.glob("/tmp/klog/*.log")
              if logs:
                  with open(logs[0]) as f:
                      return f.read()
              return r.stdout + r.stderr

          print("Starting monitor loop...")
          start = time.time()
          last_log_size = 0

          for tick in range(34):   # 34 × 5min = 170min max
              time.sleep(300)      # wait 5 minutes
              elapsed = int((time.time()-start)/60)
              status  = get_status()
              print(f"[{elapsed}min] {status}")

              # اقرأ الـ log وحفظه على GitHub
              log = get_log()
              if log and len(log) != last_log_size:
                  last_log_size = len(log)
                  # احفظ آخر 8000 حرف
                  save_github("kaggle_live_log.txt", log[-8000:])

                  # ابحث عن errors في الـ log
                  errors = [l for l in log.split('\n') if any(
                      e in l for e in ["Error","error","Traceback","FAILED","segfault","killed","OOM"]
                  )]
                  if errors:
                      save_github("kaggle_errors.txt", "\n".join(errors[-50:]))

                  # احفظ status
                  status_data = {
                      "elapsed_min": elapsed,
                      "status": status,
                      "log_lines": len(log.split('\n')),
                      "last_lines": log.split('\n')[-20:],
                      "errors_found": len(errors),
                  }
                  save_github("kaggle_monitor.json",
                              json.dumps(status_data, indent=2, ensure_ascii=False))

              # لو خلص
              if any(s in status for s in ["complete","error","cancel"]):
                  print(f"Kernel finished: {status}")
                  save_github("kaggle_monitor.json",
                              json.dumps({"final_status":status,"elapsed_min":elapsed,
                                         "log_tail":log.split('\n')[-30:] if log else []},
                                         indent=2))
                  break

          print("Monitor done.")
          EOF

      - name: Download final output
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p kaggle_output
          kaggle kernels output $KAGGLE_USERNAME/gvr-gpu-training -p kaggle_output/ 2>&1
          ls -lah kaggle_output/ || true

          python3 - << 'EOF'
          import os,json,requests,base64
          pat=os.environ.get("GH_PAT","")
          def save(fn,txt):
              content=base64.b64encode(txt.encode()).decode()
              url=f"https://api.github.com/repos/alhsryahmd266-jpg/omega-ai/contents/{fn}"
              check=requests.get(url,headers={"Authorization":f"token {pat}"})
              body={"message":f"Final: {fn}","content":content}
              if check.status_code==200: body["sha"]=check.json()["sha"]
              requests.put(url,headers={"Authorization":f"token {pat}"},json=body)

          result={"status":"checking"}
          if os.path.exists("kaggle_output/gvr_config.json"):
              with open("kaggle_output/gvr_config.json") as f:
                  cfg=json.load(f)
              result={"status":"SUCCESS","version":cfg.get("version"),
                      "model":cfg.get("reasoning"),"vision":cfg.get("vision"),
                      "hardware":cfg.get("hardware"),"tools":cfg.get("tools"),
                      "n_tests":len(cfg.get("test_results",[]))}
              print("✅ SUCCESS!")
          else:
              # اقرأ الـ log
              import glob
              logs=glob.glob("kaggle_output/*.log")
              if logs:
                  with open(logs[0]) as f: log=f.read()
                  result={"status":"ERROR","log_tail":log.split('\n')[-50:]}
                  save("kaggle_final_log.txt",log[-10000:])
              else:
                  result={"status":"NO_OUTPUT","files":os.listdir("kaggle_output")}

          print(json.dumps(result,indent=2,ensure_ascii=False))
          save("gvr_ultimate_result.json",json.dumps(result,indent=2,ensure_ascii=False))
          EOF
