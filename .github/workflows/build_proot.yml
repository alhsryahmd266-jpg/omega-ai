name: Build Real proot + termux-exec Binaries

on:
  workflow_dispatch:

jobs:
  build-proot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Clone termux-packages
        run: git clone --depth 1 https://github.com/termux/termux-packages.git

      - name: Pull official builder image
        run: docker pull ghcr.io/termux/package-builder:latest

      - name: Build proot for aarch64
        working-directory: termux-packages
        run: |
          set +e
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 proot > ../proot_build.log 2>&1
          echo "PROOT_EXIT=$?" >> $GITHUB_ENV
          tail -100 ../proot_build.log
          set -e

      - name: Extract proot binary from .deb
        run: |
          mkdir -p /tmp/out
          DEB=$(find termux-packages -iname "*proot*.deb" | head -1)
          echo "Found deb: $DEB"
          if [ -n "$DEB" ]; then
            cp "$DEB" /tmp/proot.deb
            mkdir -p /tmp/proot_extracted
            cd /tmp/proot_extracted
            ar x /tmp/proot.deb
            tar xf data.tar.* 2>/dev/null || tar xf data.tar
            BINARY=$(find . -path "*/bin/proot" -type f | head -1)
            echo "Binary path: $BINARY"
            if [ -n "$BINARY" ]; then
              cp "$BINARY" /tmp/out/proot-aarch64
              file /tmp/out/proot-aarch64
            fi
            # كمان جيب أي .so dependencies (libtalloc, libandroid-shmem)
            find . -iname "*.so*" -type f -exec cp {} /tmp/out/ \;
          fi
          ls -la /tmp/out/

      - name: Checkout repo for commit
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          path: gvr-repo

      - name: Commit binary with retry
        run: |
          mkdir -p gvr-repo/native_binaries/proot
          cp /tmp/out/* gvr-repo/native_binaries/proot/ 2>/dev/null || echo "nothing to copy"
          cd gvr-repo
          git config user.email "bot@gvr.com"
          git config user.name "GVR Bot"
          for i in 1 2 3 4 5 6; do
            git add native_binaries/ 2>/dev/null || true
            git commit -m "Real proot binary for arm64" --allow-empty
            git pull --rebase origin main && git push && break
            echo "Attempt $i failed, retrying..."
            sleep $((i * 5))
          done
