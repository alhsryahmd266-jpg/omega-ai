name: Build Real termux-exec Binaries

on:
  workflow_dispatch:

jobs:
  build-exec:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Clone termux-packages
        run: git clone --depth 1 https://github.com/termux/termux-packages.git

      - name: Pull official builder image
        run: docker pull ghcr.io/termux/package-builder:latest

      - name: Build termux-exec for aarch64
        working-directory: termux-packages
        run: |
          set +e
          PKG=$(find packages -maxdepth 1 -iname "*termux-exec*" -type d | head -1 | xargs basename)
          echo "Building package: $PKG"
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 "$PKG" > ../exec_build.log 2>&1
          echo "EXEC_EXIT=$?" >> $GITHUB_ENV
          tail -100 ../exec_build.log
          set -e

      - name: List ALL .deb files produced (defensive debug)
        run: |
          echo "=== All .deb files anywhere in termux-packages ==="
          find termux-packages -iname "*.deb" -exec ls -la {} \;
          echo ""
          echo "=== output-* directories ==="
          find termux-packages -maxdepth 3 -type d -iname "output*"

      - name: Extract binaries from any found .deb (defensive)
        run: |
          set +e
          mkdir -p /tmp/out
          DEBS=$(find termux-packages -iname "*termux-exec*.deb" -o -iname "*libtermux-exec*.deb" 2>/dev/null)
          if [ -z "$DEBS" ]; then
            echo "No termux-exec .deb found by name filter — listing all debs:"
            find termux-packages -iname "*.deb"
            DEBS=$(find termux-packages -iname "*.deb")
          fi
          echo "Processing debs: $DEBS"
          for DEB in $DEBS; do
            echo "--- $DEB ---"
            WORKDIR="/tmp/extract_$(basename "$DEB" .deb)_$$"
            mkdir -p "$WORKDIR"
            (cd "$WORKDIR" && ar x "$DEB" && (tar xf data.tar.* 2>/dev/null || tar xf data.tar))
            find "$WORKDIR" -iname "*.so*" -type f -exec cp {} /tmp/out/ \; 2>/dev/null
            find "$WORKDIR" -type f -iname "*exec*" ! -iname "*.so*" -exec cp {} /tmp/out/ \; 2>/dev/null
          done
          echo "=== Final /tmp/out contents ==="
          ls -la /tmp/out/ 2>/dev/null || echo "empty"
          set -e

      - name: Checkout repo for commit
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          path: gvr-repo

      - name: Commit binaries and logs with retry
        run: |
          mkdir -p gvr-repo/native_binaries/termux-exec
          cp /tmp/out/* gvr-repo/native_binaries/termux-exec/ 2>/dev/null || echo "no binaries to copy"
          cp /tmp/exec_build.log gvr-repo/native_binaries/termux-exec/build.log 2>/dev/null || true
          cd gvr-repo
          git config user.email "bot@gvr.com"
          git config user.name "GVR Bot"
          for i in 1 2 3 4 5 6; do
            git add native_binaries/ 2>/dev/null || true
            git commit -m "termux-exec build attempt v2" --allow-empty
            git pull --rebase origin main && git push && break
            echo "Attempt $i failed, retrying..."
            sleep $((i * 5))
          done
