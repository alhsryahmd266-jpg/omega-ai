name: GVR-Ultimate v4 T4x2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 175

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: pip install kaggle==1.6.17 requests -q

      - name: Configure Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "=== Kaggle account ==="
          kaggle competitions list --page 1 2>&1 | head -3

      - name: Prepare & Push to Kaggle T4x2
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kaggle_push
          # inject tokens
          python3 - << 'EOF'
          import os
          with open("kaggle_kernel/gvr_kaggle_train.py") as f:
              code = f.read()
          hft  = os.environ.get("HF_TOKEN","")
          ghp  = os.environ.get("GH_PAT","")
          code = code.replace('HFT   = os.environ.get("HF_TOKEN", "")', f'HFT   = "{hft}"')
          code = code.replace('GHPAT = os.environ.get("GH_PAT", "")',   f'GHPAT = "{ghp}"')
          with open("kaggle_push/gvr_kaggle_train.py","w") as f:
              f.write(code)
          print("Tokens injected ✅")
          EOF

          # metadata with T4x2
          KU="${KAGGLE_USERNAME}"
          cat > kaggle_push/kernel-metadata.json << EOF
          {
            "id": "${KU}/gvr-gpu-training",
            "title": "GVR Ultimate v4 - DeepSeek R1 + Vision + All Tools",
            "code_file": "gvr_kaggle_train.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "accelerator": "nvidiaTeslaT4x2",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": []
          }
          EOF
          echo "Metadata:" && cat kaggle_push/kernel-metadata.json

          cd kaggle_push
          kaggle kernels push -p . 2>&1
          echo "Pushed to Kaggle ✅"
          echo "https://kaggle.com/${KU}/gvr-gpu-training"

      - name: Monitor + Read Logs
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'EOF'
          import subprocess, time, requests, base64, os, json

          KU    = os.environ.get("KAGGLE_USERNAME","")
          GHPAT = os.environ.get("GH_PAT","")
          KSLUG = f"{KU}/gvr-gpu-training"

          def krun(args):
              r = subprocess.run(["kaggle"]+args, capture_output=True, text=True)
              return r.stdout.strip(), r.stderr.strip()

          def save_gh(filename, data):
              content = base64.b64encode(data.encode()).decode()
              url = f"https://api.github.com/repos/alhsryahmd266-jpg/omega-ai/contents/{filename}"
              h   = {"Authorization": f"token {GHPAT}"}
              chk = requests.get(url, headers=h)
              body= {"message": f"GVR monitor: {filename}", "content": content}
              if chk.status_code == 200:
                  body["sha"] = chk.json()["sha"]
              requests.put(url, headers=h, json=body)

          print(f"Monitoring {KSLUG} …")

          for tick in range(35):          # max 35 × 5min = 175 min
              time.sleep(300)
              status_out, _ = krun(["kernels","status", KSLUG])
              print(f"[{tick+1}/35 | {(tick+1)*5}min] {status_out}")

              # save live status
              save_gh("kaggle_live_status.txt",
                      f"tick={tick+1} | {status_out} | {time.strftime('%H:%M:%S')}")

              done = any(w in status_out.lower()
                         for w in ["complete","error","cancel","fail"])
              if done:
                  print("Kernel finished!")
                  break

          # read log
          log_out, log_err = krun(["kernels","output", KSLUG, "-p", "/tmp/kout"])
          print(f"Output download: {log_out} {log_err}")

          import glob, os
          files = glob.glob("/tmp/kout/**/*", recursive=True)
          print(f"Files: {files}")

          log_text = ""
          for f in files:
              if f.endswith(".log"):
                  with open(f) as fp:
                      log_text = fp.read()
                  break

          if log_text:
              # save full log to GitHub
              save_gh("kaggle_kernel_log.txt", log_text[-8000:])
              print("Log saved to GitHub ✅")

              # detect error
              lines = log_text.split("\n")
              err_lines = [l for l in lines if any(
                  w in l for w in ["Error","Traceback","FAIL","Killed","Segfault","segfault"])]
              if err_lines:
                  save_gh("kaggle_errors.txt", "\n".join(err_lines[-50:]))
                  print("Errors saved ✅")
                  print("ERRORS FOUND:")
                  for l in err_lines[-20:]: print(" ", l)
              else:
                  print("No errors in log ✅")
          else:
              save_gh("kaggle_kernel_log.txt",
                      f"No log file. Files found: {files}\nstatus: {status_out}")

          EOF

      - name: Save Final Result
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          python3 - << 'EOF'
          import os, json, requests, base64, glob

          GHPAT = os.environ.get("GH_PAT","")
          KU    = os.environ.get("KAGGLE_USERNAME","")

          result = {
              "status": "checked",
              "kernel": f"https://kaggle.com/{KU}/gvr-gpu-training",
              "hf_model": "https://huggingface.co/ahmedxg/gvr-ultimate"
          }

          if os.path.exists("/tmp/kout/gvr_config.json"):
              with open("/tmp/kout/gvr_config.json") as f:
                  result.update(json.load(f))
              result["status"] = "SUCCESS"
          else:
              files = glob.glob("/tmp/kout/**/*", recursive=True)
              result["output_files"] = [os.path.basename(f) for f in files]

          content = base64.b64encode(
              json.dumps(result, indent=2, ensure_ascii=False).encode()
          ).decode()
          h   = {"Authorization": f"token {GHPAT}"}
          url = "https://api.github.com/repos/alhsryahmd266-jpg/omega-ai/contents/gvr_v4_result.json"
          chk = requests.get(url, headers=h)
          body= {"message": "GVR v4 final result", "content": content}
          if chk.status_code == 200:
              body["sha"] = chk.json()["sha"]
          requests.put(url, headers=h, json=body)
          print(json.dumps(result, indent=2, ensure_ascii=False)[:400])
          EOF
