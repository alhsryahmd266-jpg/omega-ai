name: Build GameBot APK

on:
  push:
    branches: [main]
    paths:
      - 'GameBot/**'
      - '!GameBot/training/**'
      - '!GameBot/*.md'
      - '!GameBot/tools/**'
      - '.github/workflows/build_gamebot.yml'
  workflow_dispatch:

concurrency:
  group: gamebot-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK (release, debug-signed)
        working-directory: GameBot
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gamebot_gradle.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Annotate errors
        if: always()
        run: |
          grep -E "^e: |error: |What went wrong" -A2 gamebot_gradle.log | head -80 | while IFS= read -r l; do echo "::error::${l}"; done || true

      - name: Push gradle log to branch gamebot-logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          rm -rf /tmp/lg && mkdir /tmp/lg && cp gamebot_gradle.log /tmp/lg/
          cd /tmp/lg
          git init -q -b gamebot-logs
          git add -A
          git -c user.email=bot@gvr.local -c user.name="GVR Bot" commit -qm "gamebot gradle log run ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gamebot-logs
          exit 0

      - name: Fail if gradle failed
        if: env.GRADLE_EXIT != '0'
        run: exit 1

      - name: Locate APK
        run: |
          APK=$(find GameBot/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "found: $APK"
          cp "$APK" "GameBot-1.4.${{ github.run_number }}.apk"
          echo "APK_PATH=GameBot-1.4.${{ github.run_number }}.apk" >> "$GITHUB_ENV"

      - name: Pack the training kit
        run: |
          (cd GameBot && zip -qr ../GameBot-training.zip training README.md)
          ls -la GameBot-training.zip

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "gamebot-v1.4.${{ github.run_number }}"
          name: "GameBot v1.4.${{ github.run_number }}"
          body: |
            GameBot - on-device screen-reading game bot (own-game QA). See GameBot/README.md for setup.
            APK mirror: https://huggingface.co/datasets/ahmedxg/gvr-chat-app/resolve/main/GameBot.apk
            Training kit mirror: https://huggingface.co/datasets/ahmedxg/gvr-chat-app/resolve/main/GameBot-training.zip
          files: |
            ${{ env.APK_PATH }}
            GameBot-training.zip

      - name: Mirror to HuggingFace (second download link)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python3 - <<'PYEOF' 2>&1 | tee hf_gamebot_result.txt
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "ahmedxg/gvr-chat-app"
          try:
              api.create_repo(repo, repo_type="dataset", exist_ok=True)
          except Exception as e:
              print("create_repo:", e)
          api.upload_file(path_or_fileobj=os.environ["APK_PATH"], path_in_repo="GameBot.apk", repo_id=repo, repo_type="dataset")
          api.upload_file(path_or_fileobj="GameBot-training.zip", path_in_repo="GameBot-training.zip", repo_id=repo, repo_type="dataset")
          print("UPLOADED GameBot.apk + GameBot-training.zip to", repo)
          PYEOF

      - name: Push final log (gradle + HuggingFace result)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          rm -rf /tmp/lg && mkdir /tmp/lg && cp gamebot_gradle.log /tmp/lg/
          [ -f hf_gamebot_result.txt ] && cp hf_gamebot_result.txt /tmp/lg/
          cd /tmp/lg
          git init -q -b gamebot-logs
          git add -A
          git -c user.email=bot@gvr.local -c user.name="GVR Bot" commit -qm "gamebot final log run ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gamebot-logs
          exit 0
