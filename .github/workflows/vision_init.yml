name: Vision Init (publish the starting model as vision-latest)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Collect the starting files
        run: |
          mkdir -p release
          B=https://github.com/${{ github.repository }}/releases/download
          curl -fsSL -o release/enemy_vision.tflite "$B/gamebot-final2-n-v1/yolo26n_final2_p2_1152_nhwc.tflite"
          curl -fsSL -o release/enemy_vision.pt "$B/gamebot-final2-n-v1/yolo26n_final2_p2_best.pt"
          printf "enemy\n" > release/labels.txt
          cat > release/vision_history.json << 'EOF'
          {"rounds": [{"round": 0, "accepted": true, "note": "start: yolo26n-p2 at 1152, trained on Warzone + mobile COD sets + 2 gameplay videos (about 10 minutes)"}]}
          EOF
          ls -la release
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vision-latest
          name: Vision model - latest (one file, always the newest)
          body: Stable links. enemy_vision.tflite = the app model (NHWC 1152). enemy_vision.pt = the checkpoint the next round continues from. vision_history.json = every round with its numbers.
          files: |
            release/enemy_vision.tflite
            release/enemy_vision.pt
            release/vision_history.json
            release/labels.txt
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
