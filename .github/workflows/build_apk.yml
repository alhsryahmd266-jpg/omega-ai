name: Build GVRChat APK

on:
  push:
    branches: [main]
    paths:
      - 'GVRChat/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: GVRChat
        run: npm install --legacy-peer-deps

      - name: Download llama.rn native artifacts explicitly
        working-directory: GVRChat
        run: |
          set +e
          SCRIPT="node_modules/llama.rn/install/download-native-artifacts.js"
          if [ -f "$SCRIPT" ]; then
            echo "Found downloader, running it explicitly..."
            node "$SCRIPT"
            echo "DOWNLOAD_EXIT=$?" >> "$GITHUB_ENV"
          else
            echo "Downloader not at expected path, searching..."
            find node_modules/llama.rn -iname "*download*artifact*"
            echo "DOWNLOAD_EXIT=1" >> "$GITHUB_ENV"
          fi
          echo "=== jniLibs after download ==="
          find node_modules/llama.rn -iname "*.so" -o -iname "*.aar" | head -30
          set -e

      - name: Fix llama.rn plugin
        working-directory: GVRChat
        run: |
          PLUGIN="node_modules/llama.rn/app.plugin.js"
          if [ -f "$PLUGIN" ]; then
            sed -i "s|require('../package.json')|require('./package.json')|g" "$PLUGIN" 2>/dev/null || true
            sed -i 's|require("../package.json")|require("./package.json")|g' "$PLUGIN" 2>/dev/null || true
            echo "llama.rn patched"
          fi

      - name: Prebuild
        working-directory: GVRChat
        run: |
          set +e
          npx expo prebuild --platform android --clean 2>&1 | tee ../prebuild.log
          EXIT=${PIPESTATUS[0]}
          echo "PREBUILD_EXIT=$EXIT" >> "$GITHUB_ENV"
          set -e

      - name: Save prebuild log
        if: always()
        run: |
          git config --global user.email "bot@gvr.com"
          git config --global user.name "GVR Bot"
          git add prebuild.log 2>/dev/null || true
          git commit -m "build: prebuild log [skip ci]" --allow-empty 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Fail if prebuild failed
        if: env.PREBUILD_EXIT != '0'
        run: |
          echo "Prebuild failed"
          tail -30 prebuild.log || true
          exit 1

      - name: Force New Architecture in gradle.properties
        working-directory: GVRChat/android
        run: |
          echo "=== gradle.properties BEFORE ==="
          grep -n -i "newArch" gradle.properties || echo "(newArchEnabled not present)"
          if grep -q "^newArchEnabled=" gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=true/' gradle.properties
          else
            echo "newArchEnabled=true" >> gradle.properties
          fi
          # arm64 only: the phone is arm64; 4 ABIs made the APK 185 MB and the build 4x slower
          grep -q '^reactNativeArchitectures=' gradle.properties \
            && sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties \
            || echo 'reactNativeArchitectures=arm64-v8a' >> gradle.properties
          # native libs must be extracted to disk so proot can be executed from nativeLibraryDir
          grep -q '^expo.useLegacyPackaging=' gradle.properties \
            && sed -i 's/^expo.useLegacyPackaging=.*/expo.useLegacyPackaging=true/' gradle.properties \
            || echo 'expo.useLegacyPackaging=true' >> gradle.properties
          # targetSdk 28: apps targeting < 29 may execute files from their own data dir (needed by Alpine/proot).
          # expo-build-properties refuses values < 31, so it is set here (the Expo template reads this property).
          grep -q '^android.targetSdkVersion=' gradle.properties \
            && sed -i 's/^android.targetSdkVersion=.*/android.targetSdkVersion=28/' gradle.properties \
            || echo 'android.targetSdkVersion=28' >> gradle.properties
          echo "=== gradle.properties AFTER ==="
          grep -n -i -E "newArch|reactNativeArchitectures|useLegacyPackaging|targetSdk" gradle.properties
          echo "=== build.gradle effective targetSdk line ==="
          grep -n "targetSdkVersion" build.gradle || true

      - name: Gradle init script (lint must not block a sideload-only targetSdk)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint-abort.gradle <<'EOG'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                try {
                  p.android.lint.abortOnError = false
                  p.android.lint.checkReleaseBuilds = false
                } catch (Throwable t) {
                  println "lint init script: " + t.message
                }
              }
            }
          }
          EOG
          sed -i 's/^          //' ~/.gradle/init.d/no-lint-abort.gradle
          cat ~/.gradle/init.d/no-lint-abort.gradle

      - name: Verify jniLibs actually landed
        working-directory: GVRChat
        run: |
          echo "=== llama.rn jniLibs ==="
          find android -path "*llama*" -iname "*.so" 2>/dev/null | head -20
          echo "=== terminal module jniLibs ==="
          find android -path "*terminal*" -iname "*.so" 2>/dev/null | head -20

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('GVRChat/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build APK
        working-directory: GVRChat/android
        run: |
          set +e
          # codegen of every library must exist before the app's CMake configure step runs
          ./gradlew generateCodegenArtifactsFromSchema assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            2>&1 | tee ../../gradle.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$GRADLE_EXIT" >> "$GITHUB_ENV"
          set -e

      - name: Save gradle log
        if: always()
        run: |
          git add gradle.log 2>/dev/null || true
          git commit -m "build: gradle log [skip ci]" --allow-empty 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Fail if gradle failed
        if: env.GRADLE_EXIT != '0'
        run: |
          echo "Gradle failed"
          grep -E "error:|FAILURE|Exception" gradle.log | tail -30 || true
          exit 1

      - name: Locate APK
        run: |
          APK=$(find GVRChat/android -name "*.apk" | grep -v test | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub -q
          python3 - << 'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "ahmedxg/gvr-chat-app"
          apk  = os.environ["APK_PATH"]
          try:
              api.create_repo(repo, repo_type="dataset", exist_ok=True, private=False)
          except: pass
          api.upload_file(path_or_fileobj=apk, path_in_repo="GVR-Chat.apk", repo_id=repo, repo_type="dataset")
          print("Uploaded")
          PYEOF

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "apk-${{ github.run_number }}"
          name: "GVRChat v${{ github.run_number }}"
          body: "Download: https://huggingface.co/datasets/ahmedxg/gvr-chat-app/resolve/main/GVR-Chat.apk"
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
