name: Build GVR Chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Expo CLI
        run: npm install -g eas-cli expo-cli

      - name: Install dependencies
        working-directory: GVRChat
        run: npm install --legacy-peer-deps

      - name: Patch llama.rn app.plugin.js (upstream ESM/CJS bug)
        working-directory: GVRChat
        run: |
          PLUGIN_FILE="node_modules/llama.rn/app.plugin.js"
          if [ -f "$PLUGIN_FILE" ]; then
            echo "Before patch:"
            cat "$PLUGIN_FILE"
            sed -i 's#lib/module/expo-plugin#lib/commonjs/expo-plugin#' "$PLUGIN_FILE"
            echo "After patch:"
            cat "$PLUGIN_FILE"
          else
            echo "llama.rn app.plugin.js not found - skipping patch"
          fi

      - name: Prebuild
        working-directory: GVRChat
        run: |
          set +e
          npx expo prebuild --platform android --clean > ../prebuild.log 2>&1
          echo "EXIT_CODE=$?" >> $GITHUB_ENV
          tail -150 ../prebuild.log
          set -e

      - name: Commit prebuild log always
        if: always()
        run: |
          git config user.email "bot@gvr.com"
          git config user.name "GVR Bot"
          git add prebuild.log
          git commit -m "Prebuild log v3 (patched llama.rn)" --allow-empty
          git push

      - name: Fail if prebuild failed
        run: |
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Prebuild failed, see prebuild.log"
            exit 1
          fi

      - name: Build APK with Gradle
        working-directory: GVRChat/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon > ../../gradle.log 2>&1
          echo "GRADLE_EXIT=$?" >> $GITHUB_ENV
          tail -150 ../../gradle.log
          set -e

      - name: Commit gradle log always
        if: always()
        run: |
          git config user.email "bot@gvr.com"
          git config user.name "GVR Bot"
          git add gradle.log
          git commit -m "Gradle log v3" --allow-empty
          git push

      - name: Fail if gradle failed
        run: |
          if [ "$GRADLE_EXIT" != "0" ]; then
            echo "Gradle build failed, see gradle.log"
            exit 1
          fi

      - name: Upload APK to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub -q
          python3 - << 'EOF'
          import os, glob, time
          from huggingface_hub import HfApi
          hf = os.environ.get("HF_TOKEN","")
          api = HfApi(token=hf)
          HF_USER = "ahmedxg"
          apks = glob.glob("GVRChat/android/app/build/outputs/apk/release/*.apk")
          if not apks:
              print("No APK found!")
              exit(1)
          apk_path = apks[0]
          size_mb = os.path.getsize(apk_path) / 1e6
          print(f"APK: {apk_path} ({size_mb:.1f} MB)")
          api.create_repo(f"{HF_USER}/gvr-chat-app", exist_ok=True, private=False)
          api.upload_file(
              path_or_fileobj=apk_path,
              path_in_repo="GVR-Chat.apk",
              repo_id=f"{HF_USER}/gvr-chat-app",
              repo_type="model",
              commit_message=f"GVR Chat APK v2 - {time.strftime('%Y-%m-%d %H:%M')}"
          )
          print(f"Uploaded! https://huggingface.co/{HF_USER}/gvr-chat-app/resolve/main/GVR-Chat.apk")
          EOF

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: gvr-chat-apk
          path: GVRChat/android/app/build/outputs/apk/release/*.apk
