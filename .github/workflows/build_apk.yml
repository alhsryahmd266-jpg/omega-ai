name: Build GVR Chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Expo CLI
        run: npm install -g eas-cli expo-cli

      - name: Install dependencies
        working-directory: GVRChat
        run: npm install --legacy-peer-deps

      - name: Prebuild
        working-directory: GVRChat
        run: |
          set +e
          npx expo prebuild --platform android --clean > ../prebuild.log 2>&1
          echo "EXIT_CODE=$?" >> $GITHUB_ENV
          cat ../prebuild.log
          set -e

      - name: Commit log always
        if: always()
        run: |
          git config user.email "bot@gvr.com"
          git config user.name "GVR Bot"
          git add prebuild.log
          git commit -m "Prebuild log" --allow-empty
          git push

      - name: Fail if prebuild failed
        run: |
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Prebuild failed, see prebuild.log"
            exit 1
          fi

      - name: Build APK with Gradle
        working-directory: GVRChat/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../../gradle.log

      - name: Commit gradle log
        if: always()
        run: |
          git config user.email "bot@gvr.com"
          git config user.name "GVR Bot"
          git add gradle.log
          git commit -m "Gradle log" --allow-empty
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gvr-chat-apk
          path: GVRChat/android/app/build/outputs/apk/release/*.apk
