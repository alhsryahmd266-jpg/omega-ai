name: Build GVRChat APK

on:
  push:
    branches: [main]
    paths:
      - 'GVRChat/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: GVRChat
        run: npm install --legacy-peer-deps

      - name: Fix llama.rn plugin
        working-directory: GVRChat
        run: |
          PLUGIN="node_modules/llama.rn/app.plugin.js"
          if [ -f "$PLUGIN" ]; then
            sed -i "s|require('../package.json')|require('./package.json')|g" "$PLUGIN" 2>/dev/null || true
            sed -i 's|require("../package.json")|require("./package.json")|g' "$PLUGIN" 2>/dev/null || true
            echo "llama.rn patched ✅"
          fi

      - name: Prebuild
        working-directory: GVRChat
        run: |
          set +e
          npx expo prebuild --platform android --clean 2>&1 | tee ../prebuild.log
          EXIT=${PIPESTATUS[0]}
          echo "PREBUILD_EXIT=$EXIT" >> "$GITHUB_ENV"
          set -e

      - name: Save prebuild log
        if: always()
        run: |
          git config --global user.email "bot@gvr.com"
          git config --global user.name "GVR Bot"
          git add prebuild.log 2>/dev/null || true
          git commit -m "build: prebuild log [skip ci]" --allow-empty 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Fail if prebuild failed
        if: env.PREBUILD_EXIT != '0'
        run: |
          echo "❌ Prebuild failed"
          tail -30 prebuild.log || true
          exit 1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('GVRChat/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build APK
        working-directory: GVRChat/android
        run: |
          set +e
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            2>&1 | tee ../../gradle.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$GRADLE_EXIT" >> "$GITHUB_ENV"
          set -e

      - name: Save gradle log
        if: always()
        run: |
          git add gradle.log 2>/dev/null || true
          git commit -m "build: gradle log [skip ci]" --allow-empty 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Fail if gradle failed
        if: env.GRADLE_EXIT != '0'
        run: |
          echo "❌ Gradle failed"
          grep -E "error:|FAILURE|Exception" gradle.log | tail -20 || true
          exit 1

      - name: Locate APK
        run: |
          APK=$(find GVRChat/android -name "*.apk" | grep -v test | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub -q
          python3 - << 'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "ahmedxg/gvr-chat-app"
          apk  = os.environ["APK_PATH"]
          try:
              api.create_repo(repo, repo_type="dataset", exist_ok=True, private=False)
          except: pass
          api.upload_file(
              path_or_fileobj=apk,
              path_in_repo="GVR-Chat.apk",
              repo_id=repo,
              repo_type="dataset",
          )
          print("✅ https://huggingface.co/datasets/ahmedxg/gvr-chat-app")
          PYEOF

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "apk-${{ github.run_number }}"
          name: "GVRChat v${{ github.run_number }} — with Terminal"
          body: |
            **GVRChat** — on-device AI + real Linux terminal

            **Terminal features:**
            - proot + Alpine Linux (runs on first launch, ~6 MB download)
            - Run bash, Python 3, git, curl, ffmpeg, nodejs — anything
            - Install packages: AI can `apk add` whatever it needs
            - AI calls tools automatically based on your request

            **Model support:**
            - Import any `.gguf` from your phone storage
            - Supports text, vision (Qwen-VL + mmproj), tool-use models

            **Download:** [GVR-Chat.apk](https://huggingface.co/datasets/ahmedxg/gvr-chat-app/resolve/main/GVR-Chat.apk)
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
