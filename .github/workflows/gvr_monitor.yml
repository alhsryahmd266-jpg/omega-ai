name: GVR-Ultimate v4 — Push + Monitor + Fix

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: pip install kaggle requests -q

      - name: Configure Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "✅ Kaggle configured for: $KAGGLE_USERNAME"

      - name: Inject tokens into kernel
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p kaggle_push
          cp kaggle_kernel/kernel-metadata.json kaggle_push/
          python3 - << 'EOF'
          import os
          with open("kaggle_kernel/gvr_kaggle_train.py") as f:
              code = f.read()
          code = code.replace(
              'HFT   = os.environ.get("HF_TOKEN", "")',
              f'HFT   = "{os.environ.get("HF_TOKEN","")}"'
          ).replace(
              'GHPAT = os.environ.get("GH_PAT", "")',
              f'GHPAT = "{os.environ.get("GH_PAT","")}"'
          )
          with open("kaggle_push/gvr_kaggle_train.py","w") as f:
              f.write(code)
          print("✅ Tokens injected")
          EOF

      - name: Push to Kaggle T4×2
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          cd kaggle_push
          kaggle kernels push -p . 2>&1
          echo "✅ Pushed → https://www.kaggle.com/${KAGGLE_USERNAME}/gvr-gpu-training"

      - name: Monitor + Read log every 5 min
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'EOF'
          import os, time, subprocess, requests, base64, json

          user  = os.environ["KAGGLE_USERNAME"]
          pat   = os.environ["GH_PAT"]
          slug  = f"{user}/gvr-gpu-training"
          api   = "https://api.github.com/repos/alhsryahmd266-jpg/omega-ai/contents"
          heads = {"Authorization": f"token {pat}"}

          def gh_put(path, text):
              content = base64.b64encode(text.encode()).decode()
              check = requests.get(f"{api}/{path}", headers=heads)
              body  = {"message": f"monitor: {path}", "content": content}
              if check.status_code == 200:
                  body["sha"] = check.json()["sha"]
              requests.put(f"{api}/{path}", headers=heads, json=body)

          def kaggle_status():
              r = subprocess.run(
                  ["kaggle","kernels","status", slug],
                  capture_output=True, text=True)
              return r.stdout.strip() + r.stderr.strip()

          def kaggle_log():
              subprocess.run(
                  ["kaggle","kernels","output", slug, "-p", "/tmp/kout"],
                  capture_output=True, text=True)
              lf = f"/tmp/kout/{user}_gvr-gpu-training.log"
              alt = "/tmp/kout/gvr-gpu-training.log"
              for p in [lf, alt]:
                  if os.path.exists(p):
                      with open(p) as f: return f.read()
              # try listing what we got
              import glob
              files = glob.glob("/tmp/kout/**/*", recursive=True)
              return f"No log found. Files: {files}"

          print("👁️  Monitoring started")
          iteration = 0
          while True:
              iteration += 1
              status = kaggle_status()
              ts     = time.strftime("%H:%M:%S")
              print(f"\n[{ts}] iter={iteration} | {status}")

              # always grab log for visibility
              log = kaggle_log()
              last_100 = "\n".join(log.splitlines()[-100:])
              monitor_data = json.dumps({
                  "ts": ts,
                  "iteration": iteration,
                  "status": status,
                  "log_tail": last_100,
              }, indent=2)
              gh_put("kaggle_live_monitor.json", monitor_data)
              print(f"  → Log tail saved to GitHub ({len(log)} chars)")

              # exit conditions
              if any(x in status.lower() for x in ["complete","error","cancel","fail"]):
                  print(f"\n🏁 Final status: {status}")
                  gh_put("kaggle_final_status.txt", status + "\n\nLast log:\n" + last_100)
                  break

              time.sleep(300)  # 5 min

          print("Monitor done.")
          EOF

      - name: Download results
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p kaggle_output
          kaggle kernels output ${KAGGLE_USERNAME}/gvr-gpu-training -p kaggle_output/ 2>&1
          ls -la kaggle_output/

          python3 - << 'EOF'
          import os, json, requests, base64, glob

          pat  = os.environ.get("GH_PAT","")
          user = os.environ.get("KAGGLE_USERNAME","")
          heads = {"Authorization": f"token {pat}"}
          api   = "https://api.github.com/repos/alhsryahmd266-jpg/omega-ai/contents"

          def gh_put(path, text):
              content = base64.b64encode(text.encode()).decode()
              check = requests.get(f"{api}/{path}", headers=heads)
              body  = {"message": f"result: {path}", "content": content}
              if check.status_code == 200:
                  body["sha"] = check.json()["sha"]
              requests.put(f"{api}/{path}", headers=heads, json=body)

          cfg_path = "kaggle_output/gvr_config.json"
          if os.path.exists(cfg_path):
              with open(cfg_path) as f:
                  cfg = json.load(f)
              result = {"status":"SUCCESS", **cfg}
              print("✅ SUCCESS!")
              print(json.dumps({k:v for k,v in cfg.items() if k!="test_results"}, indent=2))
          else:
              files = glob.glob("kaggle_output/**/*", recursive=True)
              result = {"status":"NO_OUTPUT", "files": files}
              print(f"⚠️  No config found. Files: {files}")

          gh_put("gvr_ultimate_result.json",
                 json.dumps(result, indent=2, ensure_ascii=False))
          print("Result saved to GitHub ✅")
          EOF
