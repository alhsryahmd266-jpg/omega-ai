name: GVR-Ultimate v4 — Push + Monitor + Fix

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: pip install kaggle requests -q

      - name: Configure Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "$KAGGLE_KEY" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "KAGGLE_API_TOKEN=$KAGGLE_KEY" >> "$GITHUB_ENV"
          echo "✅ Kaggle auth: $KAGGLE_USERNAME"

      - name: Prepare kernel (inject tokens + fix metadata)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kaggle_push

          # Fix metadata: use aion-gpu-training (existing kernel) with correct code_file
          python3 -c "
          import json, os
          meta = {
            'id': f\"{os.environ['KAGGLE_USERNAME']}/aion-gpu-training\",
            'title': 'AION GPU Training',
            'code_file': 'aion_kaggle_train.py',
            'language': 'python',
            'kernel_type': 'script',
            'is_private': True,
            'enable_gpu': True,
            'enable_tpu': False,
            'enable_internet': True,
            'dataset_sources': [f\"{os.environ['KAGGLE_USERNAME']}/deepseek-r1-qwen-14b-uncensored-gguf-20260619\"],
            'competition_sources': [],
            'kernel_sources': [],
            'model_sources': []
          }
          with open('kaggle_push/kernel-metadata.json','w') as f:
            json.dump(meta, f, indent=2)
          print('✅ metadata fixed:', meta['id'])
          print('   dataset:', meta['dataset_sources'])
          "

          # Inject GH_PAT into kernel so it can write live logs to GitHub
          python3 -c "
          import os
          with open('kaggle_kernel/aion_kaggle_train.py') as f:
              code = f.read()

          # Inject tokens at top of file
          inject = f'''
          import os as _os
          _os.environ.setdefault('GH_PAT', '${GH_PAT}')
          _os.environ.setdefault('HF_TOKEN', '${HF_TOKEN}')
          '''

          # Add live GitHub logger
          logger = '''
          import requests as _req, base64 as _b64, json as _json, time as _time

          _GH_PAT  = os.environ.get('GH_PAT', '')
          _GH_REPO = 'alhsryahmd266-jpg/omega-ai'
          _LOG_BUF = []

          def _gh_write(path, text):
              if not _GH_PAT: return
              try:
                  url = f'https://api.github.com/repos/{_GH_REPO}/contents/{path}'
                  h   = {'Authorization': f'token {_GH_PAT}'}
                  chk = _req.get(url, headers=h, timeout=10)
                  body= {'message': f'live: {path}',
                         'content': _b64.b64encode(text.encode()).decode()}
                  if chk.status_code == 200:
                      body['sha'] = chk.json()['sha']
                  _req.put(url, headers=h, json=body, timeout=10)
              except Exception as _e:
                  pass

          def _live_log(msg):
              _LOG_BUF.append(f'[{_time.strftime(\"%H:%M:%S\")}] {msg}')
              print(msg, flush=True)
              # write to GitHub every 10 messages
              if len(_LOG_BUF) % 10 == 0:
                  _gh_write('kaggle_live_monitor.json',
                      _json.dumps({'ts': _time.strftime('%H:%M:%S'),
                                   'log': chr(10).join(_LOG_BUF[-100:])},
                                  indent=2, ensure_ascii=False))
          '''

          # Insert after imports block
          lines = code.split('\n')
          insert_at = 0
          for i,l in enumerate(lines):
              if l.startswith('import ') or l.startswith('from '):
                  insert_at = i+1
          lines.insert(insert_at, logger)
          lines.insert(0, inject)
          new_code = '\n'.join(lines)

          with open('kaggle_push/aion_kaggle_train.py','w') as f:
              f.write(new_code)
          print(f'✅ kernel ready ({len(new_code)} chars)')
          "

      - name: Push to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          cd kaggle_push
          OUT=$(kaggle kernels push -p . 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -qi "successfully pushed"; then
            echo "✅ Pushed!"
          elif echo "$OUT" | grep -qi "409\|conflict"; then
            echo "::error::409 conflict"
            exit 1
          else
            echo "::warning::Push status unclear, continuing..."
          fi

      - name: Monitor live — read log every 60s
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 << 'PYEOF'
          import os, time, subprocess, requests, base64, json, glob

          user  = os.environ["KAGGLE_USERNAME"]
          pat   = os.environ["GH_PAT"]
          slug  = f"{user}/aion-gpu-training"
          api   = "https://api.github.com/repos/alhsryahmd266-jpg/omega-ai/contents"
          heads = {"Authorization": f"token {pat}"}

          def gh_put(path, text):
              url  = f"{api}/{path}"
              chk  = requests.get(url, headers=heads, timeout=10)
              body = {"message": f"monitor: {path}",
                      "content": base64.b64encode(text.encode()).decode()}
              if chk.status_code == 200:
                  body["sha"] = chk.json()["sha"]
              requests.put(url, headers=heads, json=body, timeout=15)

          def get_status():
              r = subprocess.run(
                  ["kaggle","kernels","status", slug],
                  capture_output=True, text=True)
              return (r.stdout + r.stderr).strip()

          def get_log():
              subprocess.run(
                  ["kaggle","kernels","output", slug, "-p", "/tmp/kout"],
                  capture_output=True, text=True)
              for pat_l in [f"/tmp/kout/{user}_aion-gpu-training.log",
                            "/tmp/kout/aion-gpu-training.log",
                            "/tmp/kout/*.log"]:
                  files = glob.glob(pat_l)
                  if files:
                      with open(files[0]) as f:
                          return f.read()
              files = glob.glob("/tmp/kout/**/*", recursive=True)
              return f"No log yet. Output files: {files}"

          print("👁  Monitoring started — every 60s")
          iteration = 0

          while True:
              iteration += 1
              status = get_status()
              ts     = time.strftime("%H:%M:%S")
              print(f"\n[{ts}] iter={iteration} | {status}")

              log = get_log()
              tail = "\n".join(log.splitlines()[-80:])
              print("--- LOG TAIL ---")
              print(tail[-500:])
              print("----------------")

              monitor = json.dumps({
                  "ts": ts, "iteration": iteration,
                  "status": status, "log_tail": tail,
              }, indent=2, ensure_ascii=False)
              gh_put("kaggle_live_monitor.json", monitor)
              print(f"  ✅ Written to GitHub")

              if any(x in status.lower() for x in ["complete","error","cancel","fail"]):
                  print(f"\n🏁 Final: {status}")
                  gh_put("kaggle_final_status.txt",
                         status + "\n\n" + tail)
                  break

              time.sleep(60)

          print("Monitor done.")
          PYEOF

      - name: Download & save results
        if: always()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p kaggle_output checkpoints
          kaggle kernels output "${KAGGLE_USERNAME}/aion-gpu-training" -p kaggle_output/ 2>&1 | tee kaggle_download_log.txt
          find kaggle_output -name "*.pt" -exec cp {} checkpoints/ \; 2>/dev/null || true
          find kaggle_output -name "*.json" -exec cp {} checkpoints/ \; 2>/dev/null || true
          find kaggle_output -name "*.log" -exec cp {} kaggle_kernel_log.txt \; 2>/dev/null || true
          cat checkpoints/kaggle_result.json 2>/dev/null || echo "No result yet"

      - name: Commit results
        if: always()
        run: |
          git config user.name "GVR-Monitor"
          git config user.email "monitor@aion.ai"
          git add kaggle_live_monitor.json kaggle_final_status.txt \
                  checkpoints/ kaggle_kernel_log.txt kaggle_download_log.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "GVR live results"
          git push || true
