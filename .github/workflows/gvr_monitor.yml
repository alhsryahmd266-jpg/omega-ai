name: GVR v4 T4x2 - Push + Monitor + Fix

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: pip install kaggle==1.6.17 requests -q

      - name: Configure Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "Configured: $KAGGLE_USERNAME"
          kaggle competitions list --page 1 2>&1 | head -2

      - name: Inject tokens + push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_PAT:   ${{ secrets.GH_PAT }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kaggle_push
          cp kaggle_kernel/kernel-metadata.json kaggle_push/

          python3 - << 'EOF'
          import os
          hf  = os.environ.get("HF_TOKEN","")
          pat = os.environ.get("GH_PAT","")

          with open("kaggle_kernel/gvr_kaggle_train.py") as f:
              code = f.read()

          code = code.replace(
              'HFT   = os.environ.get("HF_TOKEN", "")',
              f'HFT   = "{hf}"'
          ).replace(
              'GHPAT = os.environ.get("GH_PAT", "")',
              f'GHPAT = "{pat}"'
          )

          with open("kaggle_push/gvr_kaggle_train.py","w") as f:
              f.write(code)
          print("Tokens injected ✅")
          EOF

          cd kaggle_push
          kaggle kernels push -p . 2>&1
          echo "Pushed to Kaggle T4×2 ✅"

      - name: Monitor + read logs every 5 min
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          SLUG="${KAGGLE_USERNAME}/gvr-gpu-training"
          echo "Monitoring: https://www.kaggle.com/code/$SLUG"

          for i in $(seq 1 28); do
            sleep 300
            STATUS=$(kaggle kernels status $SLUG 2>&1 | tail -1)
            echo "[$(date '+%H:%M')] [$i/28] $STATUS"

            # اقرأ الـ log كل 5 دقائق وارفعه
            mkdir -p /tmp/klog
            kaggle kernels output $SLUG -p /tmp/klog/ 2>/dev/null || true

            if ls /tmp/klog/*.log 2>/dev/null | head -1 | grep -q log; then
              LOG=$(cat /tmp/klog/*.log 2>/dev/null | tail -30)
              echo "=== LOG TAIL ==="
              echo "$LOG"
            fi

            if echo "$STATUS" | grep -qiE "complete|error|cancel"; then
              echo "Kernel finished: $STATUS"
              break
            fi
          done

      - name: Download results + diagnose
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          SLUG="${KAGGLE_USERNAME}/gvr-gpu-training"
          mkdir -p kaggle_out
          kaggle kernels output $SLUG -p kaggle_out/ 2>&1
          echo "=== Output files ==="
          ls -la kaggle_out/ || true

          python3 - << 'EOF'
          import os, json, requests, base64, time

          pat = os.environ.get("GH_PAT","")
          result = {"ts": time.strftime("%Y-%m-%d %H:%M:%S"), "files": []}

          # read log
          for fname in os.listdir("kaggle_out"):
              fpath = f"kaggle_out/{fname}"
              result["files"].append(fname)
              if fname.endswith(".log"):
                  with open(fpath) as f: log = f.read()
                  result["log_tail"] = log[-3000:]
                  # detect error type
                  if "CUDA error" in log or "segmentation fault" in log.lower():
                      result["error_type"] = "CUDA/SEGFAULT"
                  elif "OutOfMemoryError" in log or "OOM" in log:
                      result["error_type"] = "OUT_OF_MEMORY"
                  elif "ModuleNotFoundError" in log:
                      m = __import__("re").search(r"No module named '([^']+)'", log)
                      result["error_type"] = f"MISSING_MODULE: {m.group(1) if m else '?'}"
                  elif "is complete" in log or "DONE" in log:
                      result["status"] = "SUCCESS"
              if fname.endswith(".json"):
                  with open(fpath) as f:
                      try: result["output"] = json.load(f)
                      except: pass

          if "status" not in result:
              result["status"] = "ERROR" if "error_type" in result else "UNKNOWN"

          content = base64.b64encode(json.dumps(result,indent=2,ensure_ascii=False).encode()).decode()
          check = requests.get(
              "https://api.github.com/repos/alhsryahmd266-jpg/omega-ai/contents/gvr_live_result.json",
              headers={"Authorization":f"token {pat}"}
          )
          body = {"message":"GVR v4 live result","content":content}
          if check.status_code==200: body["sha"]=check.json()["sha"]
          r = requests.put(
              "https://api.github.com/repos/alhsryahmd266-jpg/omega-ai/contents/gvr_live_result.json",
              headers={"Authorization":f"token {pat}"},json=body
          )
          print(f"Status: {result['status']} | Saved: {r.status_code}")
          if "error_type" in result:
              print(f"Error detected: {result['error_type']}")
          if "log_tail" in result:
              print("Last log lines:")
              print(result["log_tail"][-800:])
          EOF
